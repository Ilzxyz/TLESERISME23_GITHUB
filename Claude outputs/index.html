<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5 Tombol 00Kubi — TLeserisme</title>
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;gap:16px;align-items:center;
    background:radial-gradient(900px 500px at 50% 0%,#1a2036,#0b0f1c);
    font-family:'Inter',system-ui,-apple-system,sans-serif;color:#c7cede;padding:34px 16px 50px}
  .judul{text-align:center;margin-bottom:6px}
  .judul h1{font-size:17px;margin:0 0 4px}
  .judul p{margin:0;font-size:12px;color:#8b95ad}
  .tumpuk{display:flex;flex-direction:column;gap:16px;width:100%;max-width:340px}

  /* ============ 00Kubi (dasar, dari kamu) ============ */
  .button{
    --primary:#4f46e5; --neutral-1:#ffffff; --neutral-2:#f3f4f6; --radius:16px;
    cursor:pointer;border-radius:var(--radius);text-shadow:0 1px 1px rgba(0,0,0,.15);border:none;
    color:#1f2430;
    box-shadow:0 1px 1px rgba(255,255,255,.4),0 12px 24px rgba(0,0,0,.15),0 4px 8px rgba(0,0,0,.1);
    display:flex;align-items:center;justify-content:center;position:relative;
    transition:all .4s cubic-bezier(.175,.885,.32,1.275);
    width:100%;min-width:0;padding:20px;height:70px;
    font-family:'Inter',system-ui,sans-serif;font-size:19px;font-weight:600;letter-spacing:-.2px;
  }
  .button:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 2px 2px rgba(255,255,255,.4),0 18px 32px rgba(0,0,0,.15),0 8px 12px rgba(0,0,0,.1)}
  .button:active{transform:scale(1);box-shadow:0 0 1px 2px rgba(255,255,255,.3),0 10px 3px -3px rgba(0,0,0,.2)}
  .button:after{content:"";position:absolute;inset:0;border-radius:var(--radius);border:2.5px solid transparent;
    background:linear-gradient(var(--neutral-1),var(--neutral-2)) padding-box,linear-gradient(to bottom,rgba(0,0,0,.1),rgba(0,0,0,.45)) border-box;
    z-index:0;transition:all .4s ease}
  .button:hover::after{transform:scale(1.05,1.1);box-shadow:inset 0 -1px 3px 0 rgba(255,255,255,1)}
  .button::before{content:"";inset:7px 6px 6px 6px;position:absolute;background:linear-gradient(to top,var(--neutral-1),var(--neutral-2));border-radius:30px;filter:blur(.5px);z-index:2}
  .state p{display:flex;align-items:center;justify-content:center;margin:0}
  .state .icon{position:absolute;left:0;top:0;bottom:0;margin:auto;transform:scale(1.25);transition:all .3s ease;display:flex;align-items:center;justify-content:center}
  .state .icon svg{overflow:visible}
  /* Outline muter */
  .outline{position:absolute;border-radius:inherit;overflow:hidden;z-index:1;opacity:0;transition:opacity .4s ease;inset:-2px -3.5px}
  .outline::before{content:"";position:absolute;inset:-100%;background:conic-gradient(from 180deg,transparent 60%,var(--primary) 85%,transparent 100%);animation:spin 2.5s linear infinite;animation-play-state:paused;opacity:.7}
  @keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
  .button:hover .outline{opacity:1}
  .button:hover .outline::before{animation-play-state:running}
  /* Huruf */
  .state p span{display:block;opacity:0;animation:slideDown .8s ease forwards calc(var(--i) * .03s)}
  .button:hover p span{opacity:1;animation:wave .5s ease forwards calc(var(--i) * .02s)}
  .button:focus p span{opacity:1;animation:disapear .6s ease forwards calc(var(--i) * .03s)}
  @keyframes wave{30%{opacity:1;transform:translateY(4px)}50%{opacity:1;transform:translateY(-4px);color:var(--primary)}100%{opacity:1;transform:translateY(0)}}
  @keyframes slideDown{0%{opacity:0;transform:translateY(-20px) translateX(5px) rotate(-90deg);color:var(--primary);filter:blur(5px)}30%{opacity:1;transform:translateY(4px);filter:blur(0)}50%{opacity:1;transform:translateY(-3px)}100%{opacity:1;transform:translateY(0)}}
  @keyframes disapear{from{opacity:1}to{opacity:0;transform:translateX(5px) translateY(20px);color:var(--primary);filter:blur(5px)}}
  /* States */
  .state{padding-left:29px;z-index:2;display:flex;position:relative}
  .state--sent{display:none}
  .state--sent svg{transform:scale(1.25);margin-right:8px}
  .button:focus .state--default{position:absolute;opacity:0;transition:opacity .3s}
  .button:focus .state--sent{display:flex}
  .button:focus .state--sent span{opacity:0;animation:slideDown .8s ease forwards calc(var(--i) * .12s)}
  .button:focus .state--sent .icon svg{opacity:0;animation:appear 1.2s ease forwards .5s}
  @keyframes appear{0%{opacity:0;transform:scale(4) rotate(-40deg);color:var(--primary);filter:blur(4px)}30%{opacity:1;transform:scale(.6);filter:blur(1px)}50%{opacity:1;transform:scale(1.2);filter:blur(0)}100%{opacity:1;transform:scale(1)}}
  /* icon masuk pas load */
  .state--default .icon svg{animation:land .6s ease forwards}
  @keyframes land{0%{transform:translateX(-40px) translateY(20px) rotate(-40deg) scale(1.6);opacity:0;filter:blur(3px)}100%{transform:translateX(0) translateY(0) rotate(0);opacity:1;filter:blur(0)}}

  /* ===== gerak khas tiap logo (hover) ===== */
  /* Beranda: atap keangkat */
  .b-beranda:hover .atap{animation:atap .7s ease-in-out infinite}
  @keyframes atap{0%,100%{transform:translateY(0)}45%{transform:translateY(-5px)}}
  /* Cari: pembesar zoom in-out */
  .b-cari:hover .state--default .icon svg{animation:zoomp 1s ease-in-out infinite}
  @keyframes zoomp{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
  /* Jelajah: pesawat miring + lepas landas (asli 00Kubi) */
  .b-jelajah:hover .state--default .icon{transform:rotate(45deg) scale(1.25)}
  .b-jelajah:focus .state--default svg{animation:takeOff .8s linear forwards}
  .b-jelajah:focus .state--default .icon{transform:rotate(0) scale(1.25)}
  @keyframes takeOff{0%{opacity:1}60%{opacity:1;transform:translateX(80px) rotate(45deg) scale(2.2)}100%{opacity:0;transform:translateX(180px) rotate(45deg) scale(0)}}
  .b-jelajah .state--default .icon:before{content:"";position:absolute;top:50%;height:2px;width:0;left:-5px;background:linear-gradient(to right,transparent,rgba(0,0,0,.5))}
  .b-jelajah:focus .state--default .icon:before{animation:contrail .8s linear forwards}
  @keyframes contrail{0%{width:0;opacity:1}8%{width:15px}60%{opacity:.7;width:80px}100%{opacity:0;width:160px}}
  /* Koleksi: pensil nulis */
  .b-koleksi:hover .pensil{animation:nulis .5s ease-in-out infinite}
  @keyframes nulis{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(1.5px,-1.5px) rotate(-7deg)}75%{transform:translate(-1.5px,1.5px) rotate(7deg)}}
  /* Atur: roda muter */
  .b-atur:hover .state--default .icon svg{animation:putar 1.3s linear infinite}
  @keyframes putar{to{transform:rotate(360deg)}}

  .catatan{max-width:340px;margin-top:18px;font-size:12px;color:#8b95ad;text-align:center;line-height:1.7}
</style>
</head>
<body>
  <div class="judul">
    <h1>5 Tombol — rasa 00Kubi</h1>
    <p>Hover: garis muter + huruf melambai + logo gerak. Klik: konfirmasi.</p>
  </div>

  <div class="tumpuk">

    <!-- BERANDA -->
    <button class="button b-beranda">
      <div class="outline"></div>
      <div class="state state--default">
        <div class="icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <g class="atap"><path d="M3 11.5 12 4l9 7.5"/></g>
            <path d="M5.5 10.5V20h13v-9.5"/><path d="M10 20v-5h4v5"/>
          </svg>
        </div>
        <p><span style="--i:0">B</span><span style="--i:1">e</span><span style="--i:2">r</span><span style="--i:3">a</span><span style="--i:4">n</span><span style="--i:5">d</span><span style="--i:6">a</span></p>
      </div>
      <div class="state state--sent">
        <div class="icon"><svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor"><path d="M13.985 2.383L5.127 12.754 1.388 8.375l-.658.77 4.397 5.149L14.643 3.153z"></path></svg></div>
        <p><span style="--i:5">D</span><span style="--i:6">i</span><span style="--i:7">b</span><span style="--i:8">u</span><span style="--i:9">k</span><span style="--i:10">a</span></p>
      </div>
    </button>

    <!-- CARI -->
    <button class="button b-cari">
      <div class="outline"></div>
      <div class="state state--default">
        <div class="icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-5.2-5.2"/>
          </svg>
        </div>
        <p><span style="--i:0">C</span><span style="--i:1">a</span><span style="--i:2">r</span><span style="--i:3">i</span></p>
      </div>
      <div class="state state--sent">
        <div class="icon"><svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor"><path d="M13.985 2.383L5.127 12.754 1.388 8.375l-.658.77 4.397 5.149L14.643 3.153z"></path></svg></div>
        <p><span style="--i:5">S</span><span style="--i:6">i</span><span style="--i:7">a</span><span style="--i:8">p</span></p>
      </div>
    </button>

    <!-- JELAJAH -->
    <button class="button b-jelajah">
      <div class="outline"></div>
      <div class="state state--default">
        <div class="icon">
          <svg stroke="currentColor" fill="currentColor" stroke-width="0" viewBox="0 0 24 24" height="20" width="20"><path fill="none" d="M0 0h24v24H0z"></path><path d="M1.946 9.315c-.522-.174-.527-.455.01-.634l19.087-6.362c.529-.176.832.12.684.638l-5.454 19.086c-.15.529-.455.547-.679.045L12 14l6-8-8 6-8.054-2.685z"></path></svg>
        </div>
        <p><span style="--i:0">J</span><span style="--i:1">e</span><span style="--i:2">l</span><span style="--i:3">a</span><span style="--i:4">j</span><span style="--i:5">a</span><span style="--i:6">h</span></p>
      </div>
      <div class="state state--sent">
        <div class="icon"><svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor"><path d="M13.985 2.383L5.127 12.754 1.388 8.375l-.658.77 4.397 5.149L14.643 3.153z"></path></svg></div>
        <p><span style="--i:5">M</span><span style="--i:6">e</span><span style="--i:7">l</span><span style="--i:8">u</span><span style="--i:9">n</span><span style="--i:10">c</span><span style="--i:11">u</span><span style="--i:12">r</span></p>
      </div>
    </button>

    <!-- KOLEKSI -->
    <button class="button b-koleksi">
      <div class="outline"></div>
      <div class="state state--default">
        <div class="icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <g class="pensil"><path d="M14.5 4.5 19.5 9.5 9 20H4v-5z"/><path d="M12.5 6.5 17.5 11.5"/></g>
          </svg>
        </div>
        <p><span style="--i:0">K</span><span style="--i:1">o</span><span style="--i:2">l</span><span style="--i:3">e</span><span style="--i:4">k</span><span style="--i:5">s</span><span style="--i:6">i</span></p>
      </div>
      <div class="state state--sent">
        <div class="icon"><svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor"><path d="M13.985 2.383L5.127 12.754 1.388 8.375l-.658.77 4.397 5.149L14.643 3.153z"></path></svg></div>
        <p><span style="--i:5">D</span><span style="--i:6">i</span><span style="--i:7">t</span><span style="--i:8">u</span><span style="--i:9">l</span><span style="--i:10">i</span><span style="--i:11">s</span></p>
      </div>
    </button>

    <!-- ATUR -->
    <button class="button b-atur">
      <div class="outline"></div>
      <div class="state state--default">
        <div class="icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3.2"/>
            <path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>
          </svg>
        </div>
        <p><span style="--i:0">A</span><span style="--i:1">t</span><span style="--i:2">u</span><span style="--i:3">r</span></p>
      </div>
      <div class="state state--sent">
        <div class="icon"><svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor"><path d="M13.985 2.383L5.127 12.754 1.388 8.375l-.658.77 4.397 5.149L14.643 3.153z"></path></svg></div>
        <p><span style="--i:5">S</span><span style="--i:6">i</span><span style="--i:7">a</span><span style="--i:8">p</span></p>
      </div>
    </button>

  </div>

  <div class="catatan">
    Semua pakai kerangka 00Kubi yang sama, cuma logonya diganti + geraknya disesuaikan.<br>
    Lebar penuh, jadi enak di layar HP. Coba hover & klik satu-satu.
  </div>
</body>
</html>
