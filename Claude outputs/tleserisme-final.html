  /* ============ PALET ============ */
  :root{
    --bg:#e9efe9; --panel:#ffffff; --panel2:#eef4ef;
    --ink:#12201a; --redup:#5a6b60; --garis:#d4e0d5;
    --acc:#12a86e; --acc2:#0c8f7e; --acc-ink:color-mix(in srgb,var(--acc) 82%,#062418);
    --grid:color-mix(in srgb,var(--acc) 22%,transparent);
    --bg0:#dfe8df; --bg1:#eef3ee;
  }
  :root[data-mode="gelap"]{
    --bg:#05080a; --panel:#0c1116; --panel2:#0a0e12;
    --ink:#d7e6dd; --redup:#7d9488; --garis:#17242b; --acc-ink:color-mix(in srgb,var(--acc) 62%,#daffe9);
    --grid:color-mix(in srgb,var(--acc) 34%,transparent);
    --bg0:#04070a; --bg1:#080d11;
  }
  :root[data-warna="hijau"]{--acc:#12a86e;--acc2:#0c8f7e}
  :root[data-warna="biru"]{--acc:#3b74e6;--acc2:#3341d4}
  :root[data-warna="sian"]{--acc:#17b6cf;--acc2:#0f93b3}
  :root[data-warna="ungu"]{--acc:#b24ce0;--acc2:#8a2fd6}
  :root[data-warna="emas"]{--acc:#d0a94e;--acc2:#b6863c}
  :root[data-warna="merah"]{--acc:#e05749;--acc2:#c2392e}

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{overflow:hidden;background:var(--bg0);color:var(--ink);
    font-family:'JetBrains Mono','Consolas',ui-monospace,monospace;transition:background .5s ease,color .5s ease}

  /* ============ BACKGROUND 3D (dipakai SEMUA layar) ============ */
  #bg3d{position:fixed;inset:0;z-index:0;overflow:hidden;
    background:radial-gradient(130% 100% at 50% -10%, var(--bg1), var(--bg0) 60%, #000 130%)}
  .grid-floor,.grid-ceil{position:absolute;left:-50%;right:-50%;height:62vh;
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:64px 64px;opacity:.9}
  .grid-floor{bottom:-2vh;transform:perspective(420px) rotateX(74deg);transform-origin:bottom;
    -webkit-mask-image:linear-gradient(transparent,#000 70%);mask-image:linear-gradient(transparent,#000 70%);
    animation:gridmove 5.5s linear infinite}
  .grid-ceil{top:-2vh;transform:perspective(420px) rotateX(-74deg);transform-origin:top;opacity:.4;
    -webkit-mask-image:linear-gradient(#000 30%,transparent);mask-image:linear-gradient(#000 30%,transparent);
    animation:gridmove 7s linear infinite}
  @keyframes gridmove{to{background-position:0 64px}}
  #bg3d .horizon{position:absolute;left:0;right:0;top:50%;height:2px;transform:translateY(-50%);
    background:linear-gradient(90deg,transparent,var(--acc),transparent);opacity:.5;filter:blur(1px);
    box-shadow:0 0 40px 8px color-mix(in srgb,var(--acc) 40%,transparent);animation:hz 4s ease-in-out infinite}
  @keyframes hz{0%,100%{opacity:.35}50%{opacity:.7}}
  #bg3d .aurora{position:absolute;border-radius:50%;filter:blur(90px);mix-blend-mode:screen;pointer-events:none}
  #bg3d .a1{width:60vw;height:40vh;left:-8vw;top:6vh;background:radial-gradient(closest-side,color-mix(in srgb,var(--acc) 55%,transparent),transparent);animation:au1 22s ease-in-out infinite}
  #bg3d .a2{width:56vw;height:38vh;right:-10vw;top:20vh;background:radial-gradient(closest-side,color-mix(in srgb,var(--acc2) 50%,transparent),transparent);animation:au2 28s ease-in-out infinite}
  @keyframes au1{0%,100%{transform:translate(0,0) scale(1);opacity:.5}50%{transform:translate(6vw,-3vh) scale(1.15);opacity:.85}}
  @keyframes au2{0%,100%{transform:translate(0,0) scale(1.05);opacity:.45}50%{transform:translate(-7vw,4vh) scale(1);opacity:.8}}
  #bg3d .pola{position:absolute;inset:-10%;opacity:.05;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120' viewBox='0 0 120 120'><g fill='none' stroke='%23ffffff' stroke-width='1'><path d='M60 6 74 46 114 60 74 74 60 114 46 74 6 60 46 46Z'/><circle cx='60' cy='60' r='26'/></g></svg>");
    background-size:150px 150px;animation:polaGeser 80s linear infinite}
  @keyframes polaGeser{to{background-position:220px 220px}}
  #bg3d .scan{position:absolute;inset:0;pointer-events:none;opacity:.5;
    background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.05) 3px 4px)}
  :root[data-mode="gelap"] #bg3d .scan{background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.02) 3px 4px)}
  #partikel{position:absolute;inset:0;z-index:1;pointer-events:none}
  #vignette{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.6) 100%)}
  :root[data-mode="terang"] #vignette{background:radial-gradient(120% 90% at 50% 45%,transparent 62%,rgba(0,0,0,.18) 100%)}

  /* ============ GERBANG ============ */
  #panggung{position:fixed;inset:0;z-index:10;overflow:hidden;perspective:1400px;
    background:radial-gradient(130% 100% at 50% 22%, rgba(6,16,13,.55), rgba(2,7,6,.9) 68%, rgba(0,0,0,.96))}
  .lapis{position:absolute;inset:0;transition:transform .5s cubic-bezier(.2,.8,.2,1);will-change:transform}
  .pilar{position:absolute;top:-6%;height:118%;width:110px}
  .pilar::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--acc) 8%,#0a0f12) 42%,#05080a 52%,color-mix(in srgb,var(--acc) 8%,#0a0f12) 66%,transparent)}
  .pilar::after{content:"";position:absolute;top:0;bottom:0;width:1.5px;left:42%;background:linear-gradient(180deg,var(--acc),transparent 60%);opacity:.5;animation:rim 7s ease-in-out infinite}
  @keyframes rim{0%,100%{opacity:.25}50%{opacity:.7}}
  .pL1{left:4%}.pR1{right:4%;transform:scaleX(-1)}
  @media(max-width:640px){.pL1{left:-4%}.pR1{right:-4%}}

  /* --- emblem metalik gelap + perakitan --- */
  #emblem-wrap{position:absolute;left:50%;top:41%;transform:translate(-50%,-50%);cursor:pointer;z-index:6;

  #judul{position:absolute;left:50%;top:71%;transform:translateX(-50%);text-align:center;z-index:6;opacity:0;animation:muncul 2s ease 1.6s forwards}
  #judul h1{font-size:clamp(24px,5vw,44px);font-weight:700;letter-spacing:.16em;
    color:#c6d3ce;text-shadow:0 0 18px color-mix(in srgb,var(--acc) 40%,transparent)}
  #judul h1 .dot{color:var(--acc)}
  #judul p{margin-top:12px;font-size:clamp(10px,1.4vw,12px);letter-spacing:.4em;text-transform:uppercase;color:#6f847a;font-weight:400}
  @keyframes muncul{from{opacity:0;transform:translateX(-50%) translateY(16px);filter:blur(6px)}to{opacity:1;transform:translateX(-50%) translateY(0);filter:blur(0)}}
  #ketuk{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);z-index:6;text-align:center;opacity:0;animation:muncul2 2s ease 3s forwards}
  #ketuk .titik{width:7px;height:7px;border-radius:50%;background:var(--acc);margin:0 auto 10px;box-shadow:0 0 14px var(--acc);animation:kedip 2.2s ease-in-out infinite}
  #ketuk span{font-size:10px;letter-spacing:.4em;text-transform:uppercase;color:var(--redup)}
  @keyframes kedip{0%,100%{opacity:.35;transform:scale(.9)}50%{opacity:1;transform:scale(1.15)}}
  @keyframes muncul2{to{opacity:1}}
  #kilat{position:absolute;inset:0;z-index:9;background:radial-gradient(circle at 50% 41%,color-mix(in srgb,var(--acc) 60%,#fff),transparent 60%);opacity:0;pointer-events:none}
  #panggung.masuk #emblem-wrap{transform:translate(-50%,-50%) scale(11);opacity:0;filter:blur(7px)}
  #panggung.masuk .lapis,#panggung.masuk #judul,#panggung.masuk #ketuk{opacity:0;transition:all 1.2s ease}
  #panggung.masuk #kilat{animation:kilat 1.4s ease forwards}
  @keyframes kilat{0%{opacity:0}55%{opacity:0}72%{opacity:.85}100%{opacity:0}}

  /* ============ LOADER ============ */
  #trans-loader{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,var(--bg1),#000 75%)}
  #trans-loader.on{display:flex}
  .ui-abstergo{--primary:var(--acc);--secondary:color-mix(in srgb,var(--acc) 30%,transparent);--shadow-blur:3px;--animation-duration:2s;display:flex;flex-direction:column;align-items:center;row-gap:26px}
  .abstergo-loader *{box-sizing:content-box}
  .ui-abstergo .ui-text{color:var(--primary);text-shadow:0 0 6px var(--secondary);display:flex;align-items:baseline;column-gap:3px;letter-spacing:5px;font-size:12px;font-weight:700}
  .ui-abstergo .ui-dot{display:block;width:3px;height:3px;animation:dots var(--animation-duration) infinite linear;animation-delay:.4s;background-color:var(--primary)}
  .ui-abstergo .ui-dot:nth-child(2){animation-delay:.8s}.ui-abstergo .ui-dot:nth-child(3){animation-delay:1.2s}.ui-abstergo .ui-dot+.ui-dot{margin-left:3px}
  .abstergo-loader{width:103px;height:90px;position:relative}
  .abstergo-loader div{width:50px;border-right:12px solid transparent;border-left:12px solid transparent;border-top:21px solid var(--primary);position:absolute;filter:drop-shadow(0 0 var(--shadow-blur) var(--secondary))}
  .abstergo-loader div:nth-child(1){top:27px;left:7px;rotate:-60deg;animation:line1 var(--animation-duration) linear infinite alternate}
  .abstergo-loader div:nth-child(2){bottom:2px;left:0;rotate:180deg;animation:line2 var(--animation-duration) linear infinite alternate}
  .abstergo-loader div:nth-child(3){bottom:16px;right:-9px;rotate:60deg;animation:line3 var(--animation-duration) linear infinite alternate}
  @keyframes line1{0%,40%{top:27px;left:7px;rotate:-60deg}60%,100%{top:22px;left:14px;rotate:60deg}}
  @keyframes line2{0%,40%{bottom:2px;left:0;rotate:180deg}60%,100%{bottom:5px;left:-8px;rotate:300deg}}
  @keyframes line3{0%,40%{bottom:16px;right:-9px;rotate:60deg}60%,100%{bottom:7px;right:-11px;rotate:180deg}}
  @keyframes dots{0%{background-color:var(--secondary)}30%{background-color:var(--primary)}70%,100%{background-color:var(--secondary)}}

  /* ============ APP ============ */
  #app{position:fixed;inset:0;z-index:20;overflow-y:auto;opacity:0;visibility:hidden;transition:opacity 1s ease .3s}
  #app.tampil{opacity:1;visibility:visible}
  .top{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;
    background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--garis)}
  .merek{display:flex;align-items:center;gap:12px}
  .merek .lg{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--acc),var(--acc2));box-shadow:0 8px 20px color-mix(in srgb,var(--acc) 40%,transparent)}

  .merek b{font-size:17px;letter-spacing:.06em;color:var(--ink);font-weight:700}
  .merek small{display:block;font-size:10px;color:var(--redup);letter-spacing:.16em;text-transform:uppercase}
  @media(max-width:560px){.merek small{display:none}}
  .tema{display:flex;align-items:center;gap:16px}
  .warna{display:flex;gap:7px}
  .warna button{width:24px;height:24px;border-radius:7px;border:2px solid transparent;cursor:pointer;transition:.2s;position:relative}
  .warna button:hover{transform:translateY(-2px)}
  .warna button[aria-pressed="true"]{border-color:var(--ink)}
  .warna button[aria-pressed="true"]::after{content:"";position:absolute;inset:0;margin:auto;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.15)}
  .w-hijau{background:linear-gradient(150deg,#12a86e,#0c8f7e)}.w-biru{background:linear-gradient(150deg,#3b74e6,#3341d4)}
  .w-sian{background:linear-gradient(150deg,#17b6cf,#0f93b3)}.w-ungu{background:linear-gradient(150deg,#b24ce0,#8a2fd6)}
  .w-emas{background:linear-gradient(150deg,#d0a94e,#b6863c)}.w-merah{background:linear-gradient(150deg,#e05749,#c2392e)}

  .hero{max-width:900px;margin:0 auto;padding:52px 22px 6px;text-align:center;position:relative;z-index:1}
  .hero h2{font-size:clamp(26px,5vw,46px);font-weight:700;line-height:1.15;letter-spacing:.01em;color:var(--ink);text-shadow:0 0 24px color-mix(in srgb,var(--acc) 30%,transparent)}
  .hero h2 .g{color:var(--acc)}
  .hero p{margin-top:14px;color:var(--redup);font-size:clamp(12px,1.7vw,14px);font-weight:400;line-height:1.7}

  .tumpuk{max-width:360px;margin:34px auto 0;display:flex;flex-direction:column;gap:15px;position:relative;z-index:1;padding:0 16px}
  .button{--primary:var(--acc);--neutral-1:var(--panel);--neutral-2:var(--panel2);--radius:14px;
    cursor:pointer;border-radius:var(--radius);border:none;color:var(--ink);
    box-shadow:0 1px 1px color-mix(in srgb,var(--ink) 8%,transparent),0 12px 24px rgba(0,0,0,.16),0 4px 8px rgba(0,0,0,.1);
    display:flex;align-items:center;justify-content:center;position:relative;transition:all .4s cubic-bezier(.175,.885,.32,1.275);
    width:100%;padding:18px;height:66px;font-family:inherit;font-size:17px;font-weight:700;letter-spacing:0}
  .button:hover{transform:translateY(-2px) scale(1.02)}.button:active{transform:scale(1)}
  .button:after{content:"";position:absolute;inset:0;border-radius:var(--radius);border:2.5px solid transparent;background:linear-gradient(var(--neutral-1),var(--neutral-2)) padding-box,linear-gradient(to bottom,color-mix(in srgb,var(--ink) 10%,transparent),color-mix(in srgb,var(--ink) 40%,transparent)) border-box;z-index:0;transition:all .4s ease}
  .button:hover::after{transform:scale(1.05,1.1)}
  .button::before{content:"";inset:7px 6px 6px 6px;position:absolute;background:linear-gradient(to top,var(--neutral-1),var(--neutral-2));border-radius:28px;filter:blur(.5px);z-index:2}
  .state p{display:flex;align-items:center;justify-content:center;margin:0}
  .state .icon{position:absolute;left:0;top:0;bottom:0;margin:auto;transform:scale(1.2);transition:all .3s ease;display:flex;align-items:center;justify-content:center}
  .state .icon svg{overflow:visible;stroke:var(--acc-ink)}
  .outline{position:absolute;border-radius:inherit;overflow:hidden;z-index:1;opacity:0;transition:opacity .4s ease;inset:-2px -3.5px}
  .outline::before{content:"";position:absolute;inset:-100%;background:conic-gradient(from 180deg,transparent 60%,var(--primary) 85%,transparent 100%);animation:spin 2.5s linear infinite;animation-play-state:paused;opacity:.85}
  @keyframes spin{to{transform:rotate(360deg)}}
  .button:hover .outline{opacity:1}.button:hover .outline::before{animation-play-state:running}
  .state p span{display:block;opacity:0;animation:slideDown .8s ease forwards calc(var(--i) * .03s)}
  .button:hover p span{opacity:1;animation:wave .5s ease forwards calc(var(--i) * .02s)}
  .button:focus p span{opacity:1;animation:disapear .6s ease forwards calc(var(--i) * .03s)}
  @keyframes wave{30%{opacity:1;transform:translateY(4px)}50%{opacity:1;transform:translateY(-4px);color:var(--primary)}100%{opacity:1;transform:translateY(0)}}
  @keyframes slideDown{0%{opacity:0;transform:translateY(-20px) translateX(5px) rotate(-90deg);color:var(--primary);filter:blur(5px)}30%{opacity:1;transform:translateY(4px);filter:blur(0)}50%{opacity:1;transform:translateY(-3px)}100%{opacity:1;transform:translateY(0)}}
  @keyframes disapear{from{opacity:1}to{opacity:0;transform:translateX(5px) translateY(20px);color:var(--primary);filter:blur(5px)}}
  .state{padding-left:29px;z-index:2;display:flex;position:relative}
  .state--sent{display:none}.state--sent svg{transform:scale(1.2);margin-right:8px;stroke:none;fill:var(--acc)}
  .button:focus .state--default{position:absolute;opacity:0;transition:opacity .3s}
  .button:focus .state--sent{display:flex}
  .button:focus .state--sent span{opacity:0;animation:slideDown .8s ease forwards calc(var(--i) * .12s)}
  .button:focus .state--sent .icon svg{opacity:0;animation:appear 1.2s ease forwards .5s}
  @keyframes appear{0%{opacity:0;transform:scale(4) rotate(-40deg);filter:blur(4px)}50%{opacity:1;transform:scale(1.2)}100%{opacity:1;transform:scale(1)}}
  .state--default .icon svg{animation:land .6s ease forwards}
  @keyframes land{0%{transform:translateX(-40px) translateY(20px) rotate(-40deg) scale(1.6);opacity:0;filter:blur(3px)}100%{transform:translateX(0) translateY(0) rotate(0);opacity:1;filter:blur(0)}}
  .b-beranda:hover .atap{animation:atap .7s ease-in-out infinite}@keyframes atap{0%,100%{transform:translateY(0)}45%{transform:translateY(-5px)}}
  .b-cari:hover .state--default .icon svg{animation:zoomp 1s ease-in-out infinite}@keyframes zoomp{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
  .b-jelajah:hover .state--default .icon{transform:rotate(45deg) scale(1.2)}
  .b-jelajah:focus .state--default svg{animation:takeOff .8s linear forwards}
  @keyframes takeOff{0%{opacity:1}60%{opacity:1;transform:translateX(80px) rotate(45deg) scale(2.2)}100%{opacity:0;transform:translateX(180px) rotate(45deg) scale(0)}}
  .b-koleksi:hover .pensil{animation:nulis .5s ease-in-out infinite}@keyframes nulis{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(1.5px,-1.5px) rotate(-7deg)}75%{transform:translate(-1.5px,1.5px) rotate(7deg)}}
  .b-atur:hover .state--default .icon svg{animation:putar 1.3s linear infinite}@keyframes putar{to{transform:rotate(360deg)}}

  .kaki{max-width:900px;margin:40px auto 0;padding:22px;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;color:var(--redup);font-size:11px;letter-spacing:.05em;position:relative;z-index:1}
  .kaki a{color:var(--acc);cursor:pointer;text-decoration:none}

  /* ===== BB8 TOGGLE (Galahhad) ===== */
  .bb8-toggle{--toggle-size:11px;--toggle-width:10.625em;--toggle-height:5.625em;--toggle-offset:calc((var(--toggle-height) - var(--bb8-diameter))/2);--toggle-bg:linear-gradient(#2c4770,#070e2b 35%,#628cac 50% 70%,#a6c5d4) no-repeat;--bb8-diameter:4.375em;--radius:99em;--transition:.4s;--accent:#de7d2f;--bb8-bg:#fff;cursor:pointer;font-size:var(--toggle-size)}
  .bb8-toggle,.bb8-toggle *,.bb8-toggle *::before,.bb8-toggle *::after{box-sizing:border-box}
  .bb8-toggle__checkbox{appearance:none;display:none}
  .bb8-toggle__container{width:var(--toggle-width);height:var(--toggle-height);background:var(--toggle-bg);background-size:100% 11.25em;background-position-y:-5.625em;border-radius:var(--radius);position:relative;transition:var(--transition)}
  .bb8{display:flex;flex-direction:column;align-items:center;position:absolute;top:calc(var(--toggle-offset) - 1.688em + .188em);left:var(--toggle-offset);transition:var(--transition);z-index:2}
  .bb8__head-container{position:relative;transition:var(--transition);z-index:2;transform-origin:1.25em 3.75em}
  .bb8__head{overflow:hidden;margin-bottom:-.188em;width:2.5em;height:1.688em;background:linear-gradient(transparent .063em,dimgray .063em .313em,transparent .313em .375em,var(--accent) .375em .5em,transparent .5em 1.313em,silver 1.313em 1.438em,transparent 1.438em),linear-gradient(45deg,transparent .188em,var(--bb8-bg) .188em 1.25em,transparent 1.25em),linear-gradient(-45deg,transparent .188em,var(--bb8-bg) .188em 1.25em,transparent 1.25em),linear-gradient(var(--bb8-bg) 1.25em,transparent 1.25em);border-radius:var(--radius) var(--radius) 0 0;position:relative;z-index:1;filter:drop-shadow(0 .063em .125em gray)}
  .bb8__head::before{content:"";position:absolute;width:.563em;height:.563em;background:radial-gradient(.125em circle at .25em .375em,red,transparent),radial-gradient(.063em circle at .375em .188em,var(--bb8-bg) 50%,transparent 100%),linear-gradient(45deg,#000 .188em,dimgray .313em .375em,#000 .5em);border-radius:var(--radius);top:.413em;left:50%;transform:translate(-50%);box-shadow:0 0 0 .089em lightgray,.563em .281em 0 -.148em,.563em .281em 0 -.1em var(--bb8-bg),.563em .281em 0 -.063em;z-index:1;transition:var(--transition)}

    <button class="button b-atur"><div class="outline"></div><div class="state state--default"><div class="icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg></div><p><span style="--i:0">A</span><span style="--i:1">t</span><span style="--i:2">u</span><span style="--i:3">r</span></p></div><div class="state state--sent"><div class="icon"><svg viewBox="0 0 16 16" width="18" height="18"><path d="M13.985 2.383L5.127 12.754 1.388 8.375l-.658.77 4.397 5.149L14.643 3.153z"/></svg></div><p><span style="--i:5">S</span><span style="--i:6">i</span><span style="--i:7">a</span><span style="--i:8">p</span></p></div></button>

<!-- ============ CARI SCREEN ============ -->
<div id="cari-screen">
  <button class="kembali" onclick="tutupCari()">← Kembali</button>
  <div class="tajuk">PENCARIAN IBARAT</div>
  <div class="search-container">
    <div class="search-wrapper">
      <div class="search-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></div>
      <input class="search-input" placeholder="cari ibarat / kitab" spellcheck="false">
      <div class="search-decoration"><span class="spore"></span><span class="spore"></span><span class="spore"></span></div>
      <button class="search-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></button>
    </div>
    <div class="search-label">PENCARIAN</div>
    <div class="search-status">siap</div>
  </div>
</div>

<script>
  const root=document.documentElement;
  /* ---- warna ---- */
  document.querySelectorAll('#warna button').forEach(b=>b.onclick=()=>{root.dataset.warna=b.dataset.w;
    document.querySelectorAll('#warna button').forEach(x=>x.removeAttribute('aria-pressed'));b.setAttribute('aria-pressed','true');});
  /* ---- BB8 mode (checked = gelap) ---- */
  document.getElementById('mode-bb8').addEventListener('change',e=>{root.dataset.mode=e.target.checked?'gelap':'terang';});

  /* ---- perakitan emblem ---- */
  (function(){
    const wrap=document.getElementById('emblem-wrap'),cont=document.getElementById('shards');
    const COLS=4,ROWS=5;
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
      const s=document.createElement('div');s.className='shard';
      const t=r*100/ROWS, b=(ROWS-1-r)*100/ROWS, l=c*100/COLS, ri=(COLS-1-c)*100/COLS;
      s.style.clipPath=`inset(${t}% ${ri}% ${b}% ${l}%)`;
      const dx=(Math.random()*2-1)*window.innerWidth*.6, dy=(Math.random()*2-1)*window.innerHeight*.6, rot=(Math.random()*2-1)*180;
      s.style.transform=`translate(${dx}px,${dy}px) rotate(${rot}deg) scale(.35)`;
      s.style.transitionDelay=(Math.random()*.8)+'s';
      cont.appendChild(s);
    }
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      cont.querySelectorAll('.shard').forEach(s=>{s.style.transform='translate(0,0) rotate(0) scale(1)';s.style.opacity='1';});
    }));
    setTimeout(()=>{wrap.classList.add('rakit');},2600);        // metal solid muncul, shard fade
    setTimeout(()=>{wrap.style.animation='apungWrap 7s ease-in-out infinite';},3200);
  })();

  /* ---- parallax ---- */
  const lapisan=[...document.querySelectorAll('#panggung .lapis')];let tx=0,ty=0,cx=0,cy=0;
  addEventListener('mousemove',e=>{tx=(e.clientX/innerWidth-.5);ty=(e.clientY/innerHeight-.5);});
  addEventListener('deviceorientation',e=>{if(e.gamma!=null){tx=Math.max(-.5,Math.min(.5,e.gamma/45));ty=Math.max(-.5,Math.min(.5,e.beta/90));}});
  (function loop(){cx+=(tx-cx)*.06;cy+=(ty-cy)*.06;
    lapisan.forEach(l=>{const d=+l.dataset.depth;l.style.transform=`translate3d(${-cx*d}px,${-cy*d}px,0)`;});
    requestAnimationFrame(loop);})();

  /* ---- partikel ---- */
  const cv=document.getElementById('partikel'),g=cv.getContext('2d');let P=[];
  function warnaAcc(){return getComputedStyle(root).getPropertyValue('--acc').trim()||'#12a86e';}
  function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255];}
  function nP(){return{x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*1.6+.3,s:Math.random()*.4+.08,o:Math.random()*.5+.12,tw:Math.random()*6.28,a:Math.random()<.5};}
  function ukur(){cv.width=innerWidth;cv.height=innerHeight;P=Array.from({length:Math.min(100,innerWidth/13|0)},nP);}
  function draw(){g.clearRect(0,0,cv.width,cv.height);const rgb=hexToRgb(warnaAcc());
    for(const p of P){p.y-=p.s;if(p.y<-6){p.y=cv.height+6;p.x=Math.random()*cv.width;}p.tw+=.02;const a=p.o*(.6+.4*Math.sin(p.tw));
      const col=p.a?`${rgb[0]},${rgb[1]},${rgb[2]}`:'200,220,230';
      g.beginPath();g.arc(p.x,p.y,p.r,0,6.28);g.fillStyle=`rgba(${col},${a})`;g.shadowBlur=7;g.shadowColor=`rgba(${col},${a})`;g.fill();}
    requestAnimationFrame(draw);}
  ukur();draw();addEventListener('resize',ukur);

  /* ---- transisi masuk ---- */
  const panggung=document.getElementById('panggung'),app=document.getElementById('app'),loader=document.getElementById('trans-loader');let sudah=false;
  document.getElementById('emblem-wrap').addEventListener('click',()=>{if(sudah)return;sudah=true;
    document.getElementById('emblem-wrap').style.animation='none';
    panggung.classList.add('masuk');
    setTimeout(()=>{loader.classList.add('on');app.classList.add('tampil');},1000);
    setTimeout(()=>{panggung.style.display='none';document.body.style.overflow='auto';},1500);
    setTimeout(()=>loader.classList.remove('on'),2300);});

  /* ---- cari ---- */
  const cariScreen=document.getElementById('cari-screen');
  document.querySelector('.b-cari').addEventListener('click',()=>{cariScreen.classList.add('on');setTimeout(()=>cariScreen.querySelector('.search-input').focus(),120);});
  function tutupCari(){cariScreen.classList.remove('on');}
  addEventListener('keydown',e=>{if(e.key==='Escape')tutupCari();});
</script>
<style>@keyframes apungWrap{0%,100%{transform:translate(-50%,-50%) translateY(0)}50%{transform:translate(-50%,-50%) translateY(-12px)}}</style>
</body>
</html>
